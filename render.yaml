services:
  - type: web
    name: yandc-review-hub-api
    env: python
    rootDir: .
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: APIFY_API_TOKEN
        sync: false
      - key: GROQ_API_KEY
        sync: false

  - type: web
    name: yandc-review-hub
    env: node
    rootDir: frontend
    buildCommand: npm ci && npm run build
    startCommand: npm start
    envVars:
      - key: NEXT_PUBLIC_API_URL
        value: https://yandc-review-hub-api.onrender.com
